<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Zombie Survival</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22></svg>" />
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #1a1c16;
      overflow: hidden;
      font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    }
    canvas {
      display: block;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      width: 100%;
      height: 100%;
    }
    #hint {
      position: fixed;
      left: 50%;
      bottom: 18px;
      transform: translateX(-50%);
      color: rgba(245, 239, 220, 0.85);
      background: rgba(20, 22, 16, 0.45);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      font-size: 12px;
      letter-spacing: 0.04em;
      padding: 6px 12px;
      border-radius: 4px;
      pointer-events: none;
      user-select: none;
    }
    #hud {
      position: fixed; left: 12px; top: 12px; display: flex; flex-direction: column; gap: 4px;
      color: rgba(245,239,220,0.9); background: rgba(20,22,16,0.45);
      backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
      font-size: 11px; padding: 6px 8px; border-radius: 4px; pointer-events: none; user-select: none;
    }
    .bar-row { display: flex; align-items: center; gap: 8px; }
    #hp, #stamina { width: 72px; height: 5px; background: rgba(0,0,0,0.5); border-radius: 2px; overflow: hidden; }
    #hpfill { height: 100%; width: 100%; background: #c94a3c; transition: width 120ms linear; }
    #stamfill { height: 100%; width: 100%; background: #4a9cff; transition: width 80ms linear; }
    #weapon { text-transform: capitalize; opacity: 0.85; }
    #stats { opacity: 0.8; font-size: 10px; }
    #banner {
      display: none; position: fixed; left: 50%; top: 42%; transform: translate(-50%, -50%);
      color: #f5efdc; background: rgba(20,22,16,0.75); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
      font-size: 14px; padding: 14px 20px; border-radius: 6px; pointer-events: none; text-align: center;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <canvas id="game"></canvas>
  <div id="hud">
    <div class="bar-row"><div id="hp"><div id="hpfill"></div></div><span id="weapon"></span></div>
    <div class="bar-row"><div id="stamina"><div id="stamfill"></div></div><span style="opacity:0.6">STAM</span></div>
    <div id="stats">Kills: 0 · Time: 0s · Wave 1</div>
  </div>
  <div id="banner">You died<br><span id="banner-stats"></span><br>press R to restart</div>
  <div id="hint">WASD move · Shift sprint · Click/J swing · 1-4 or Q/E weapon · B/F1 boxes · R reset</div>
  <script src="game.js"></script>
</body>
</html>
