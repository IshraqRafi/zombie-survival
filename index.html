<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Zombie Survival</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22></svg>" />
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #0c0d0a;
      overflow: hidden;
      font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
      color: #f3ead6;
    }
    canvas#game {
      display: block;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      width: 100%;
      height: 100%;
    }

    /* ---------- overlays ---------- */
    .overlay {
      position: fixed;
      inset: 0;
      z-index: 30;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(6, 7, 5, 0.55);
      opacity: 0;
      pointer-events: none;
      transition: opacity 180ms ease;
    }
    .overlay.show {
      opacity: 1;
      pointer-events: auto;
    }
    .overlay.pause {
      background: rgba(0, 0, 0, 0.18);
    }
    .card {
      min-width: 300px;
      max-width: 360px;
      padding: 32px 36px 28px;
      background: rgba(12, 13, 10, 0.9);
      border: 1px solid rgba(243, 234, 214, 0.16);
      box-shadow: 0 18px 50px rgba(0, 0, 0, 0.45);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      text-align: center;
    }
    .card h1 {
      margin: 0 0 4px;
      font-size: 30px;
      font-weight: 600;
      letter-spacing: 0.22em;
      line-height: 1.05;
    }
    .card h1 em {
      font-style: normal;
      color: #e85a4a;
    }
    .card h2 {
      margin: 0 0 18px;
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.28em;
      opacity: 0.8;
    }
    .rule {
      height: 1px;
      margin: 14px auto 18px;
      width: 72px;
      background: linear-gradient(90deg, transparent, rgba(243,234,214,0.5), transparent);
    }
    .card button {
      display: block;
      width: 100%;
      margin-top: 8px;
      padding: 11px 14px;
      background: transparent;
      border: 1px solid rgba(243, 234, 214, 0.22);
      color: #f3ead6;
      font: inherit;
      font-size: 12px;
      letter-spacing: 0.18em;
      cursor: pointer;
      transition: background 120ms ease, border-color 120ms ease;
    }
    .card button:hover {
      background: rgba(243, 234, 214, 0.08);
      border-color: rgba(243, 234, 214, 0.55);
    }
    .card button.primary {
      border-color: #f3ead6;
    }
    .card button.danger:hover {
      border-color: #e85a4a;
      color: #ffd0c8;
    }
    .blank {
      margin: 28px 0 22px;
      font-size: 12px;
      letter-spacing: 0.2em;
      opacity: 0.35;
    }
    .fine {
      margin-top: 18px;
      font-size: 10px;
      letter-spacing: 0.06em;
      opacity: 0.45;
      line-height: 1.5;
    }

    /* ---------- HUD ---------- */
    #hud {
      position: fixed;
      left: 16px;
      top: 16px;
      z-index: 10;
      display: none;
      flex-direction: column;
      gap: 6px;
      pointer-events: none;
      user-select: none;
    }
    #hud.on { display: flex; }
    .bar {
      position: relative;
      width: 168px;
      height: 16px;
      background: rgba(8, 9, 7, 0.72);
      border: 1px solid rgba(243, 234, 214, 0.22);
      box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.55);
      overflow: hidden;
    }
    .bar .fill {
      height: 100%;
      width: 100%;
      transition: width 90ms linear;
    }
    .bar.hp .fill {
      background: linear-gradient(180deg, #ff7a68 0%, #d64536 55%, #a32e24 100%);
      box-shadow: 0 0 10px rgba(232, 90, 74, 0.45);
    }
    .bar.stam .fill {
      background: linear-gradient(180deg, #8fd0ff 0%, #3d93e6 55%, #1f62b0 100%);
      box-shadow: 0 0 10px rgba(74, 168, 255, 0.4);
    }
    .bar .tag {
      position: absolute;
      left: 6px;
      top: 0;
      height: 16px;
      line-height: 16px;
      font-size: 9px;
      letter-spacing: 0.12em;
      color: #fff;
      text-shadow: 0 1px 2px #000;
    }
    .bar .val {
      position: absolute;
      right: 6px;
      top: 0;
      height: 16px;
      line-height: 16px;
      font-size: 9px;
      letter-spacing: 0.04em;
      color: #fff;
      text-shadow: 0 1px 2px #000;
    }
    #stats {
      margin-top: 2px;
      font-size: 10px;
      letter-spacing: 0.06em;
      opacity: 0.75;
    }

    /* ---------- selected item ---------- */
    #selected {
      position: fixed;
      top: 16px;
      right: 16px;
      z-index: 10;
      display: none;
      align-items: center;
      gap: 10px;
      padding: 6px 12px 6px 6px;
      background: rgba(10, 11, 8, 0.62);
      border: 1px solid rgba(243, 234, 214, 0.18);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      pointer-events: none;
      user-select: none;
    }
    #selected.on { display: flex; }
    #selected canvas {
      width: 40px;
      height: 40px;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      background: rgba(0, 0, 0, 0.25);
    }
    #selected .meta { display: flex; flex-direction: column; gap: 2px; }
    #selected-name {
      font-size: 12px;
      letter-spacing: 0.08em;
      text-transform: capitalize;
    }
    #selected-ammo {
      font-size: 10px;
      letter-spacing: 0.1em;
      opacity: 0.7;
    }

    /* ---------- hotbar ---------- */
    #hotbar {
      position: fixed;
      left: 50%;
      bottom: 18px;
      transform: translateX(-50%);
      z-index: 10;
      display: none;
      gap: 7px;
      pointer-events: auto;
      user-select: none;
    }
    #hotbar.on { display: flex; }
    .slot {
      position: relative;
      width: 56px;
      height: 56px;
      background: rgba(10, 11, 8, 0.72);
      border: 1px solid rgba(243, 234, 214, 0.18);
      box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.4);
      cursor: pointer;
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
    }
    .slot:hover { border-color: rgba(243, 234, 214, 0.4); }
    .slot.selected {
      border-color: #f3ead6;
      box-shadow: 0 0 0 1px #f3ead6, 0 0 14px rgba(243, 234, 214, 0.22), inset 0 0 0 1px rgba(0,0,0,0.3);
    }
    .slot canvas {
      position: absolute;
      left: 8px;
      top: 8px;
      width: 40px;
      height: 40px;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      pointer-events: none;
    }
    .slot .key {
      position: absolute;
      top: 3px;
      left: 5px;
      font-size: 9px;
      letter-spacing: 0.04em;
      opacity: 0.55;
    }
    .slot .amt {
      position: absolute;
      right: 4px;
      bottom: 2px;
      font-size: 10px;
      letter-spacing: 0.04em;
      color: #f3ead6;
      text-shadow: 0 1px 2px #000;
    }
    .slot.empty-ammo .amt { color: #e85a4a; }

    /* ---------- death ---------- */
    #banner {
      display: none;
      position: fixed;
      left: 50%;
      top: 38%;
      transform: translate(-50%, -50%);
      z-index: 15;
      color: #f3ead6;
      background: rgba(12, 13, 10, 0.82);
      border: 1px solid rgba(243, 234, 214, 0.16);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      font-size: 14px;
      letter-spacing: 0.08em;
      padding: 16px 22px;
      text-align: center;
      line-height: 1.55;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <canvas id="game"></canvas>

  <div id="hud">
    <div class="bar hp"><div class="fill" id="hpfill"></div><span class="tag">HP</span><span class="val" id="hpval">100</span></div>
    <div class="bar stam"><div class="fill" id="stamfill"></div><span class="tag">STA</span><span class="val" id="stamval">100</span></div>
    <div id="stats">Kills 0 · 0s · Wave 1</div>
  </div>

  <div id="selected">
    <canvas id="selected-icon" width="48" height="48"></canvas>
    <div class="meta">
      <div id="selected-name">—</div>
      <div id="selected-ammo"></div>
    </div>
  </div>

  <div id="hotbar"></div>

  <div id="banner">YOU DIED<br><span id="banner-stats"></span><br>R to restart</div>

  <div id="start-menu" class="overlay show">
    <div class="card">
      <h1>ZOMBIE<br><em>SURVIVAL</em></h1>
      <div class="rule"></div>
      <button id="btn-start" class="primary">START</button>
      <button id="btn-settings-start">SETTINGS</button>
      <div class="fine">WASD move · Shift sprint · Click attack<br>1–7 or Q/E weapons · Esc pause</div>
    </div>
  </div>

  <div id="pause-menu" class="overlay pause">
    <div class="card">
      <h2>PAUSED</h2>
      <button id="btn-resume" class="primary">RESUME</button>
      <button id="btn-restart">RESTART</button>
      <button id="btn-settings">SETTINGS</button>
      <button id="btn-leave" class="danger">LEAVE</button>
    </div>
  </div>

  <div id="settings-panel" class="overlay">
    <div class="card">
      <h2>SETTINGS</h2>
      <div class="blank">—</div>
      <button id="btn-settings-back" class="primary">BACK</button>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
