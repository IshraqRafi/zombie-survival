<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Zombie Survival</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22></svg>" />
  <style>
    :root {
      --bg: #0b0c09;
      --surface: rgba(14, 15, 12, 0.92);
      --ink: #f4ecd8;
      --ink-dim: rgba(244, 236, 216, 0.64);
      --ink-mute: rgba(244, 236, 216, 0.38);
      --line: rgba(244, 236, 216, 0.16);
      --line-strong: rgba(244, 236, 216, 0.42);
      --hp: #e24b3a;
      --hp-hi: #ff8a78;
      --stam: #3b8fe0;
      --stam-hi: #8ecbff;
      --danger: #e24b3a;
      --s1: 4px;
      --s2: 8px;
      --s3: 12px;
      --s4: 16px;
      --s5: 24px;
      --s6: 32px;
      --r-sm: 2px;
      --r-md: 4px;
      --r-lg: 6px;
      --t-xs: 10px;
      --t-sm: 12px;
      --t-md: 14px;
      --t-lg: 20px;
      --t-xl: 34px;
      --ease: cubic-bezier(0.16, 1, 0.3, 1);
      --shadow: 0 16px 40px rgba(0, 0, 0, 0.4);
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
    html, body {
      margin: 0;
      height: 100%;
      background: var(--bg);
      overflow: hidden;
      font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
      color: var(--ink);
      font-variant-numeric: tabular-nums;
    }
    canvas#game {
      display: block;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      width: 100%;
      height: 100%;
    }

    /* ---------- overlays ---------- */
    .overlay {
      position: fixed;
      inset: 0;
      z-index: 30;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(6, 7, 5, 0.5);
      opacity: 0;
      pointer-events: none;
      transition: opacity 180ms var(--ease);
    }
    .overlay.show { opacity: 1; pointer-events: auto; }
    .overlay.pause { background: rgba(0, 0, 0, 0.12); }
    .card {
      min-width: 300px;
      max-width: 340px;
      padding: var(--s6) var(--s6) var(--s5);
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--r-lg);
      box-shadow: var(--shadow);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      text-align: center;
    }
    .card h1 {
      margin: 0;
      font-size: var(--t-xl);
      font-weight: 600;
      letter-spacing: -0.02em;
      line-height: 1.05;
    }
    .card h1 em { font-style: normal; color: var(--hp); }
    .card h2 {
      margin: 0 0 var(--s4);
      font-size: var(--t-xs);
      font-weight: 500;
      letter-spacing: 0.22em;
      line-height: 1.2;
      color: var(--ink-dim);
    }
    .rule {
      height: 1px;
      margin: var(--s4) auto var(--s5);
      width: 64px;
      background: var(--line-strong);
    }
    .card .actions { display: flex; flex-direction: column; gap: var(--s2); }
    .card button {
      display: block;
      width: 100%;
      padding: 11px var(--s4);
      background: transparent;
      border: 1px solid var(--line-strong);
      border-radius: var(--r-sm);
      color: var(--ink);
      font: inherit;
      font-size: var(--t-sm);
      letter-spacing: 0.14em;
      cursor: pointer;
      transition: transform 150ms var(--ease), background 150ms var(--ease), border-color 150ms var(--ease), color 150ms var(--ease);
    }
    .card button:focus-visible {
      outline: 2px solid var(--ink);
      outline-offset: 2px;
    }
    @media (hover: hover) and (pointer: fine) {
      .card button:hover { background: rgba(244, 236, 216, 0.06); }
      .card button.primary:hover { background: #fff6e4; }
      .card button.danger:hover { border-color: var(--danger); color: #ffcfc8; }
    }
    .card button:active { transform: scale(0.96); }
    .card button.primary {
      background: var(--ink);
      color: #14160f;
      border-color: var(--ink);
    }
    .card button.danger { color: var(--ink-dim); }
    .blank {
      margin: var(--s6) 0 var(--s5);
      font-size: var(--t-sm);
      letter-spacing: 0.16em;
      color: var(--ink-mute);
    }
    .fine {
      margin: var(--s4) 0 0;
      font-size: var(--t-xs);
      letter-spacing: 0.04em;
      line-height: 1.55;
      color: var(--ink-mute);
    }
    .overlay.show .card { animation: rise 300ms var(--ease) both; }
    .overlay.show .card h1,
    .overlay.show .card h2 { animation: rise 300ms var(--ease) both; }
    .overlay.show .actions button:nth-child(1) { animation: rise 300ms var(--ease) 100ms both; }
    .overlay.show .actions button:nth-child(2) { animation: rise 300ms var(--ease) 200ms both; }
    .overlay.show .actions button:nth-child(3) { animation: rise 300ms var(--ease) 300ms both; }
    .overlay.show .actions button:nth-child(4) { animation: rise 300ms var(--ease) 400ms both; }
    @keyframes rise {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* ---------- HUD ---------- */
    #hud {
      position: fixed;
      left: var(--s4);
      top: var(--s4);
      z-index: 10;
      display: none;
      flex-direction: column;
      gap: var(--s2);
      pointer-events: none;
      user-select: none;
    }
    #hud.on { display: flex; }
    .bar {
      position: relative;
      width: 176px;
      height: 18px;
      background: rgba(8, 9, 7, 0.7);
      border: 1px solid var(--line);
      border-radius: var(--r-sm);
      overflow: hidden;
    }
    .bar .fill {
      height: 100%;
      width: 100%;
      transition: width 90ms linear;
    }
    .bar.hp .fill { background: linear-gradient(180deg, var(--hp-hi), var(--hp)); }
    .bar.stam .fill { background: linear-gradient(180deg, var(--stam-hi), var(--stam)); }
    .bar .tag, .bar .val {
      position: absolute;
      top: 0;
      height: 18px;
      line-height: 18px;
      font-size: var(--t-xs);
      letter-spacing: 0.08em;
      color: #fff;
      text-shadow: 0 1px 1px rgba(0, 0, 0, 0.7);
      font-variant-numeric: tabular-nums;
    }
    .bar .tag { left: 6px; }
    .bar .val { right: 6px; }
    #stats {
      margin-top: var(--s1);
      font-size: var(--t-xs);
      letter-spacing: 0.04em;
      color: var(--ink-dim);
      font-variant-numeric: tabular-nums;
    }

    /* ---------- selected ---------- */
    #selected {
      position: fixed;
      top: var(--s4);
      right: var(--s4);
      z-index: 10;
      display: none;
      align-items: center;
      gap: var(--s3);
      padding: var(--s2) var(--s3) var(--s2) var(--s2);
      background: rgba(10, 11, 8, 0.7);
      border: 1px solid var(--line);
      border-radius: var(--r-md);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      pointer-events: none;
      user-select: none;
    }
    #selected.on { display: flex; }
    #selected canvas {
      width: 40px;
      height: 40px;
      image-rendering: pixelated;
      background: rgba(0, 0, 0, 0.28);
      border-radius: var(--r-sm);
    }
    #selected .meta { display: flex; flex-direction: column; gap: 2px; min-width: 72px; }
    #selected-name {
      font-size: var(--t-sm);
      letter-spacing: 0.04em;
      text-transform: capitalize;
      line-height: 1.2;
    }
    #selected-ammo {
      font-size: var(--t-xs);
      letter-spacing: 0.08em;
      color: var(--ink-dim);
      font-variant-numeric: tabular-nums;
    }

    /* ---------- hotbar ---------- */
    #hotbar {
      position: fixed;
      left: 50%;
      bottom: var(--s4);
      transform: translateX(-50%);
      z-index: 10;
      display: none;
      gap: var(--s2);
      pointer-events: auto;
      user-select: none;
    }
    #hotbar.on { display: flex; }
    .slot {
      position: relative;
      width: 56px;
      height: 56px;
      padding: 0;
      background: rgba(10, 11, 8, 0.74);
      border: 1px solid var(--line);
      border-radius: var(--r-md);
      cursor: pointer;
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      transition: transform 150ms var(--ease), border-color 150ms var(--ease);
    }
    .slot:focus-visible {
      outline: 2px solid var(--ink);
      outline-offset: 2px;
    }
    @media (hover: hover) and (pointer: fine) {
      .slot:hover { border-color: var(--line-strong); }
    }
    .slot:active { transform: scale(0.96); }
    .slot.selected {
      border-color: var(--ink);
      box-shadow: 0 0 0 1px var(--ink);
    }
    .slot canvas {
      position: absolute;
      left: 8px;
      top: 8px;
      width: 40px;
      height: 40px;
      image-rendering: pixelated;
      pointer-events: none;
    }
    .slot .key {
      position: absolute;
      top: 3px;
      left: 5px;
      font-size: 9px;
      letter-spacing: 0.04em;
      color: var(--ink-dim);
    }
    .slot .amt {
      position: absolute;
      right: 4px;
      bottom: 2px;
      font-size: var(--t-xs);
      letter-spacing: 0.02em;
      color: var(--ink);
      text-shadow: 0 1px 1px #000;
      font-variant-numeric: tabular-nums;
    }
    .slot.empty-ammo .amt { color: var(--hp-hi); }

    /* ---------- death ---------- */
    #banner {
      display: none;
      position: fixed;
      left: 50%;
      top: 36%;
      transform: translate(-50%, -50%);
      z-index: 15;
      color: var(--ink);
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--r-md);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      font-size: var(--t-md);
      letter-spacing: 0.06em;
      padding: var(--s4) var(--s5);
      text-align: center;
      line-height: 1.5;
      pointer-events: none;
      box-shadow: var(--shadow);
    }
  </style>
</head>
<body>
  <canvas id="game"></canvas>

  <div id="hud">
    <div class="bar hp" role="meter" aria-label="Health" aria-valuemin="0" aria-valuemax="100">
      <div class="fill" id="hpfill"></div>
      <span class="tag">HP</span>
      <span class="val" id="hpval">100</span>
    </div>
    <div class="bar stam" role="meter" aria-label="Stamina" aria-valuemin="0" aria-valuemax="100">
      <div class="fill" id="stamfill"></div>
      <span class="tag">STA</span>
      <span class="val" id="stamval">100</span>
    </div>
    <div id="stats">Kills 0 · 0s · Wave 1</div>
  </div>

  <div id="selected">
    <canvas id="selected-icon" width="48" height="48" aria-hidden="true"></canvas>
    <div class="meta">
      <div id="selected-name">—</div>
      <div id="selected-ammo"></div>
    </div>
  </div>

  <div id="hotbar" role="toolbar" aria-label="Weapons"></div>

  <div id="banner" role="status">YOU DIED<br><span id="banner-stats"></span><br>R to restart</div>

  <div id="start-menu" class="overlay show" role="dialog" aria-modal="true" aria-labelledby="start-title">
    <div class="card">
      <h1 id="start-title">ZOMBIE<br><em>SURVIVAL</em></h1>
      <div class="rule" aria-hidden="true"></div>
      <div class="actions">
        <button id="btn-start" class="primary">START</button>
        <button id="btn-settings-start">SETTINGS</button>
      </div>
      <p class="fine">WASD move · Shift sprint · Click attack<br>1–7 or Q/E weapons · Esc pause</p>
    </div>
  </div>

  <div id="pause-menu" class="overlay pause" role="dialog" aria-modal="true" aria-labelledby="pause-title">
    <div class="card">
      <h2 id="pause-title">PAUSED</h2>
      <div class="actions">
        <button id="btn-resume" class="primary">RESUME</button>
        <button id="btn-restart">RESTART</button>
        <button id="btn-settings">SETTINGS</button>
        <button id="btn-leave" class="danger">LEAVE</button>
      </div>
    </div>
  </div>

  <div id="settings-panel" class="overlay" role="dialog" aria-modal="true" aria-labelledby="settings-title">
    <div class="card">
      <h2 id="settings-title">SETTINGS</h2>
      <div class="blank">—</div>
      <div class="actions">
        <button id="btn-settings-back" class="primary">BACK</button>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
